name: swing-collect

# 스윙 탐색용 시세 수집. 열쇠(API 키)·로그인 없음. 이 저장소의 swing/ 폴더에만 쓴다.
on:
  schedule:
    - cron: "30 9 * * 1-5"    # 18:30 KST 월~금: 한국장 마감 뒤
    - cron: "0 22 * * 1-5"    # 07:00 KST 화~토: 미국장 마감 뒤
  workflow_dispatch:
    inputs:
      market:
        description: "kr 또는 us"
        required: true
        default: "kr"
        type: choice
        options: [kr, us]

permissions:
  contents: write

concurrency:
  group: swing-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install -q "pandas>=2.2,<3" numpy requests lxml "yfinance>=0.2.60"

      - name: 시장 정하기
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          CHOICE: ${{ inputs.market }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then m="$CHOICE"
          elif [ "$CRON" = "30 9 * * 1-5" ]; then m="kr"
          else m="us"; fi
          case "$m" in kr|us) ;; *) echo "알 수 없는 시장: $m"; exit 1 ;; esac
          echo "market=$m" >> "$GITHUB_OUTPUT"

      - name: 수집
        env:
          MARKET: ${{ steps.pick.outputs.market }}
        run: python swing/collector.py --market "$MARKET" --out swing

      - name: 저장소에 올리기
        env:
          MARKET: ${{ steps.pick.outputs.market }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add swing
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -q -m "swing: $MARKET $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase -q && git push -q && exit 0
            sleep 5
          done
          exit 1
